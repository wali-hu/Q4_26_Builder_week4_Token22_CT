[package]
name = "token22-ct"
version = "0.1.0"
edition = "2021"
description = "Token-2022 remittance stablecoin: fees, frozen-by-default KYC, metadata, confidential transfers, permanent delegate"

[dependencies]
spl-token-2022-interface = "2.1.0"
spl-token-confidential-transfer-proof-generation = "0.5.1"
spl-token-confidential-transfer-proof-extraction = "0.5.1"
solana-zk-sdk = "4.0.0"
spl-token-metadata-interface = "0.8.0"
spl-pod = "0.7.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-clock = "3.0.0"
solana-pubkey = "3.0.0"
solana-instruction = "3.0.0"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
spl-type-length-value = "0.9.1"
spl-associated-token-account-interface = "2.0.0"

[dev-dependencies]
